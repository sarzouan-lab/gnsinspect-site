name: Deploy to gnsinspect.ca
# Publishes the site to the Doteasy hosting account over FTP.
# Runs on every push to main once the three FTP secrets exist; until then it skips.
# Can also be started by hand: Actions > Deploy to gnsinspect.ca > Run workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - name: Check that hosting credentials are configured
        id: cfg
        run: |
          if [ -n "$FTP_SERVER" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; else echo "FTP secrets not set - nothing deployed."; fi
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ready == 'true'
      - uses: actions/setup-python@v5
        if: steps.cfg.outputs.ready == 'true'
        with: { python-version: "3.12" }
      - name: Build production site
        if: steps.cfg.outputs.ready == 'true'
        run: |
          python3 build.py
          test -f dist/index.html && test -f dist/en/index.html && test -f dist/sitemap.xml
          ! grep -q 'content="noindex"' dist/index.html
      - name: Upload changed files to Doteasy
        if: steps.cfg.outputs.ready == 'true'
        env:
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          # Doteasy hosting server, addressed by IP: the FTP port is not reachable through the
          # domain name. Its certificate is issued to the host's own name, so the name check is
          # relaxed; the connection is still encrypted (TLS is forced).
          FTP_HOST: 209.42.24.221
        run: |
          sudo apt-get install -y -qq lftp >/dev/null
          lftp --env-password -u "$FTP_USER" "$FTP_HOST" -e "
            set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate no;
            set net:timeout 30; set net:max-retries 3; set cmd:fail-exit true;
            mirror --reverse --verbose --parallel=4 --no-perms dist/ ./;
            cls -1a; quit"
      - name: Check the live site
        if: steps.cfg.outputs.ready == 'true'
        continue-on-error: true
        run: |
          for h in gnsinspect.ca www.gnsinspect.ca; do echo "$h -> $(getent hosts $h | awk '{print $1}' | tr '\n' ' ')"; done
          echo "== public DNS =="
          curl -sS -m 20 -o /tmp/live.html -w "status %{http_code} ip %{remote_ip} final %{url_effective}\n" -L https://gnsinspect.ca/ || true
          grep -o '<title>[^<]*</title>' /tmp/live.html | head -1 || true
          grep -c 'wp-content' /tmp/live.html || true
          curl -sS -m 20 -o /dev/null -w "facades page status %{http_code}\n" -L https://gnsinspect.ca/inspection-facades-loi-122/ || true
          echo "== hosting server 209.42.24.221 directly =="
          curl -sS -m 20 -k -o /tmp/direct.html -w "status %{http_code}\n" --resolve gnsinspect.ca:443:209.42.24.221 https://gnsinspect.ca/ || true
          grep -o '<title>[^<]*</title>' /tmp/direct.html | head -1 || true
          curl -sS -m 20 -k -o /dev/null -w "facades page status %{http_code}\n" --resolve gnsinspect.ca:443:209.42.24.221 https://gnsinspect.ca/inspection-facades-loi-122/ || true
          curl -sS -m 20 -k -o /dev/null -w "deploy subfolder status %{http_code}\n" --resolve gnsinspect.ca:443:209.42.24.221 https://gnsinspect.ca/deploy/ || true
