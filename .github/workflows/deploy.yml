name: Deploy to gnsinspect.ca
# Publishes the site to the Doteasy hosting account over FTP.
# Runs on every push to main once the three FTP secrets exist; until then it skips.
# Can also be started by hand: Actions > Deploy to gnsinspect.ca > Run workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - name: Check that hosting credentials are configured
        id: cfg
        run: |
          if [ -n "$FTP_SERVER" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; else echo "FTP secrets not set - nothing deployed."; fi
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ready == 'true'
      - uses: actions/setup-python@v5
        if: steps.cfg.outputs.ready == 'true'
        with: { python-version: "3.12" }
      - name: Build production site
        if: steps.cfg.outputs.ready == 'true'
        run: |
          python3 build.py
          test -f dist/index.html && test -f dist/en/index.html && test -f dist/sitemap.xml
          ! grep -q 'content="noindex"' dist/index.html
      - name: Connection diagnostics
        if: steps.cfg.outputs.ready == 'true'
        continue-on-error: true
        env:
          U: ${{ secrets.FTP_USERNAME }}
          P: ${{ secrets.FTP_PASSWORD }}
        run: |
          echo "== explicit TLS =="
          curl -sS -v --max-time 40 --ssl-reqd --list-only --user "$U:$P" ftp://gnsinspect.ca/ 2>&1 | grep -vE '^\{|^\}|bytes data' | head -60 || true
          echo "== explicit TLS, certificate not checked =="
          curl -sS -v --max-time 40 --ssl-reqd -k --list-only --user "$U:$P" ftp://gnsinspect.ca/ 2>&1 | grep -vE '^\{|^\}|bytes data' | tail -25 || true
      - name: Upload changed files to Doteasy
        if: steps.cfg.outputs.ready == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          # The site's own host name: ftp.gnsinspect.ca does not point at the hosting server.
          server: gnsinspect.ca
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ./
